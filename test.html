<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 HelloWorld 互動面板</title>
    <!-- 引入最新的 Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js" type="application/javascript"></script>
    <style>
        :root {
            --primary-color: #00d4ff;
            --secondary-color: #0055ff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            max-width: 650px; 
            margin: 40px auto; 
            line-height: 1.6;
            padding: 0 20px;
        }

        h1 { text-align: center; color: var(--primary-color); text-shadow: 0 0 10px rgba(0,212,255,0.3); }

        .container { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .dot { height: 10px; width: 10px; background-color: #ef4444; border-radius: 50%; display: inline-block; }
        .dot.active { background-color: #10b981; box-shadow: 0 0 8px #10b981; }

        button { 
            padding: 12px; margin-top: 10px; width: 100%; 
            cursor: pointer; background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: white; border: none; border-radius: 8px; 
            font-size: 16px; font-weight: 600; transition: 0.3s;
        }

        button:disabled { background: #475569; cursor: not-allowed; }
        button:hover:not(:disabled) { transform: translateY(-2px); opacity: 0.9; }

        input { 
            width: 100%; padding: 12px; margin-top: 10px; 
            background: #0f172a; border: 1px solid #334155; 
            border-radius: 8px; color: white; box-sizing: border-box;
            font-size: 16px;
        }

        #messageOutput { 
            background-color: #0f172a; padding: 20px; border-radius: 8px; 
            text-align: center; font-size: 1.2em; font-weight: bold;
            color: var(--primary-color); border: 1px dashed #334155;
            margin: 15px 0;
        }

        #output { 
            background-color: #020617; padding: 15px; border-radius: 8px; 
            font-family: 'Courier New', monospace; font-size: 0.85em;
            color: #94a3b8; height: 150px; overflow-y: auto;
            border-left: 4px solid var(--secondary-color);
        }

        hr { border: 0; border-top: 1px solid #334155; margin: 25px 0; }
        .note { color: #64748b; font-size: 0.85em; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>Web3 合約互動面板</h1>
    
    <div class="container">
        <div class="status-bar">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">連線狀態：未連接錢包</span>
        </div>

        <button id="connectBtn">1. 連接 MetaMask 錢包</button>
        
        <hr>

        <h2>當前合約訊息</h2>
        <div id="messageOutput">"等待讀取中..."</div>
        <button id="refreshBtn" style="background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color);">手動重新整理訊息</button>

        <hr>

        <h2>更新儲存訊息</h2>
        <input type="text" id="newMessageInput" placeholder="輸入你想儲存到區塊鏈的字串..." />
        <button id="updateBtn" disabled>發送更新交易</button>
        <div class="note">⚠️ 此操作為寫入區塊鏈，需支付 Sepolia ETH 作為 Gas 費。</div>

        <hr>

        <h2>系統執行日誌</h2>
        <pre id="output"></pre>
    </div>

    <script>
        // --- 設定區：請確認地址與 ABI ---
        // 這是你在截圖中顯示的合約地址
        const CONTRACT_ADDRESS = "0x9DBe087a545d283DeBBFecC6D5A6b3cA8aC755bF"; 
        
        const CONTRACT_ABI = [
            { "inputs": [], "name": "message", "outputs": [{ "internalType": "string", "name": "", "type": "string" }], "stateMutability": "view", "type": "function" },
            { "inputs": [{ "internalType": "string", "name": "_newMessage", "type": "string" }], "name": "updateMessage", "outputs": [], "stateMutability": "nonpayable", "type": "function" }
        ];

        // 定義 DOM 元素
        const connectBtn = document.getElementById("connectBtn");
        const updateBtn = document.getElementById("updateBtn");
        const refreshBtn = document.getElementById("refreshBtn");
        const messageOutput = document.getElementById("messageOutput");
        const newMessageInput = document.getElementById("newMessageInput");
        const output = document.getElementById("output");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");

        let provider, signer, contract;

        // 函式：日誌記錄
        function log(msg) {
            const now = new Date().toLocaleTimeString();
            output.textContent += `[${now}] ${msg}\n`;
            output.scrollTop = output.scrollHeight;
        }

        // 函式：連接錢包
        async function connectWallet() {
            try {
                if (!window.ethereum) {
                    log("錯誤: 找不到 MetaMask。");
                    return;
                }

                log("正在請求 MetaMask 授權...");
                await window.ethereum.request({ method: "eth_requestAccounts" });
                
                // Ethers v6 語法
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                const address = await signer.getAddress();
                log(`成功連接！地址: ${address.substring(0,6)}...${address.substring(38)}`);
                
                // 更新 UI 狀態
                statusDot.classList.add("active");
                statusText.textContent = "連線狀態：已連結 Sepolia 網路";
                connectBtn.textContent = "錢包已連結";
                connectBtn.disabled = true;
                updateBtn.disabled = false;

                await getMessage();
            } catch (error) {
                log(`連接失敗: ${error.message}`);
            }
        }

        // 函式：讀取訊息 (View)
        async function getMessage() {
            if (!contract) return;
            try {
                log("讀取合約訊息中...");
                // 呼叫合約中的 message() 變數
                const msg = await contract.message();
                messageOutput.textContent = `"${msg}"`;
                log("訊息讀取成功。");
            } catch (error) {
                log(`讀取失敗: ${error.message}`);
            }
        }

        // 函式：更新訊息 (Transaction)
        async function updateMessage() {
            const newText = newMessageInput.value;
            if (!newText) {
                alert("請輸入訊息內容！");
                return;
            }

            try {
                log(`準備發送交易: "${newText}"`);
                const tx = await contract.updateMessage(newText);
                log(`交易已發送！Hash: ${tx.hash.substring(0,16)}...`);
                
                log("等待區塊鏈確認交易 (通常需 15-30 秒)...");
                await tx.wait();
                log("✅ 交易確認完畢！");
                
                newMessageInput.value = "";
                await getMessage(); // 更新畫面顯示
            } catch (error) {
                log(`交易出錯: ${error.message}`);
            }
        }

        // 事件監聽
        connectBtn.addEventListener("click", connectWallet);
        updateBtn.addEventListener("click", updateMessage);
        refreshBtn.addEventListener("click", getMessage);

        window.addEventListener("DOMContentLoaded", () => {
            log("系統就緒，請先連接錢包。");
        });
    </script>
</body>
</html>
